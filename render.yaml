services:
  - type: web
    name: ai-link-analysis-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: MINIMAL
      - key: MAX_CONTENT_CHARS
        value: "6500"
      - key: GEMINI_API_KEY
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: APP_ENV
        value: production
